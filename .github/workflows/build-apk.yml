name: Android APK

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # AGP 9.3.1 lint currently calls Java 21 collection APIs on Linux.
  JAVA_VERSION: '21'
  ANDROID_PLATFORM: 'platforms;android-36'
  ANDROID_BUILD_TOOLS: 'build-tools;36.0.0'

jobs:
  verify:
    name: Verify and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The legacy 'tools' package in the action's default list no longer exists.
          packages: 'platform-tools'

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Lint and assemble clean APKs
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Stage CI artifacts
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(./gradlew --no-daemon -q :app:printVersionName)"
          mkdir -p dist

          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/ImageLingo-v${version}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            "dist/ImageLingo-v${version}-release-unsigned.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Upload CI APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ImageLingo-v${{ steps.metadata.outputs.version }}-ci-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Sign and publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The legacy 'tools' package in the action's default list no longer exists.
          packages: 'platform-tools'

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          version="$(./gradlew --no-daemon -q :app:printVersionName)"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match app version ${expected_tag}." >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Decode release keystore
        env:
          IMAGELINGO_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IMAGELINGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IMAGELINGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IMAGELINGO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in \
            IMAGELINGO_KEYSTORE_BASE64 \
            IMAGELINGO_KEYSTORE_PASSWORD \
            IMAGELINGO_KEY_ALIAS \
            IMAGELINGO_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing GitHub release-signing secret for ${variable}." >&2
              exit 1
            fi
          done
          printf '%s' "${IMAGELINGO_KEYSTORE_BASE64}" \
            | base64 --decode > "${RUNNER_TEMP}/imagelingo-release.jks"
          chmod 600 "${RUNNER_TEMP}/imagelingo-release.jks"
          echo "IMAGELINGO_KEYSTORE_PATH=${RUNNER_TEMP}/imagelingo-release.jks" >> "${GITHUB_ENV}"

      - name: Build signed release APK
        env:
          IMAGELINGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IMAGELINGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IMAGELINGO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace clean assembleRelease

      - name: Verify and stage signed APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "${source_apk}"
          apksigner verify --verbose --print-certs "${source_apk}"

          mkdir -p dist
          release_apk="dist/ImageLingo-v${{ steps.version.outputs.value }}-release.apk"
          cp "${source_apk}" "${release_apk}"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ImageLingo-v${{ steps.version.outputs.value }}-signed
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "ImageLingo ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/imagelingo-release.jks"
