name: Bug report
description: Report a reproducible ImageLingo problem without sharing private data
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Remove API keys, service-account data, private images, and folder names before submitting."
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: "1.0.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android device and version
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Gemini API, OpenAI Responses API, Vertex AI, Not provider-specific]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private images, prompts, and identifying folder names.
          required: true
