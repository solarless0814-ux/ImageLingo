plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rarisol.imagelingo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rarisol.imagelingo'
        minSdk 28
        targetSdk 35
        versionCode 9
        versionName '0.8.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
